<!--
  The app signs in with the six-digit code, so {{ .Token }} is required.
  Supabase's stock template contains only {{ .ConfirmationURL }}, which the
  verify screen cannot use.

  Local dev picks this up via supabase/config.toml. For wasla-dev and
  wasla-prod, paste this into
  Authentication -> Email Templates -> Magic Link in the dashboard.

  Table layout and inline styles only: email clients strip <style> blocks,
  external stylesheets and most modern CSS. Colours are the paper theme from
  lib/theme.ts, repeated here because an email cannot import the app bundle —
  scripts/check-theme.mjs asserts they still match.
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#E4E8E1;padding:32px 16px;">
  <tr>
    <td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:480px;background-color:#EFF2ED;border:1px solid #DADFD5;border-radius:4px;">
        <tr>
          <td style="padding:28px 28px 0 28px;font-family:Georgia,'Times New Roman',serif;font-size:22px;line-height:1.3;color:#101D22;">
            Your sign-in code
          </td>
        </tr>
        <tr>
          <td style="padding:12px 28px 0 28px;font-family:Helvetica,Arial,sans-serif;font-size:16px;line-height:1.5;color:#4C6067;">
            Enter this code in WASLA to sign in. It expires in one hour.
          </td>
        </tr>
        <tr>
          <td style="padding:20px 28px 0 28px;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background-color:#DADFD5;border-radius:4px;">
              <tr>
                <td align="center" style="padding:18px 12px;font-family:'SF Mono',Menlo,Consolas,monospace;font-size:30px;letter-spacing:8px;color:#101D22;">
                  {{ .Token }}
                </td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td style="padding:20px 28px 0 28px;font-family:Helvetica,Arial,sans-serif;font-size:16px;line-height:1.5;color:#4C6067;">
            Or <a href="{{ .ConfirmationURL }}" style="color:#1F5F73;">open WASLA in this browser</a> to sign in directly.
          </td>
        </tr>
        <tr>
          <td style="padding:20px 28px 28px 28px;font-family:Helvetica,Arial,sans-serif;font-size:14px;line-height:1.5;color:#4C6067;border-top:1px solid #DADFD5;">
            If you did not request this, ignore this email. Nobody can sign in without the code.
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>

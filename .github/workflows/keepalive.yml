name: keepalive

# Supabase pauses a free project after 7 days with no activity, which would
# kill the demo the day a recruiter opens it. This is the cheapest possible
# heartbeat. Note GitHub disables scheduled workflows on a repo with no commits
# for 60 days — push something, or re-enable it in the Actions tab.

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase
        env:
          SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          # public.keepalive() from 0002_rls.sql. Every table is denied to anon
          # by design, and PostgREST can answer schema requests from cache, so
          # an RPC is the only call that provably reaches Postgres.
          body=$(curl -sS -X POST \
            "$SUPABASE_URL/rest/v1/rpc/keepalive" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H 'Content-Type: application/json' \
            -w '\n%{http_code}' -d '{}')
          echo "$body"
          test "$(echo "$body" | tail -1)" = "200"

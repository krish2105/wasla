name: web-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # One source of truth. wrangler, miniflare and unpdf all require
          # Node >= 22, so this cannot drift back down without breaking the
          # Worker build.
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Install Worker dependencies
        # worker/ is a separate npm project (its own package-lock.json) so the
        # root `npm ci` above does not touch it. Without this, worker:typecheck
        # fails on a fresh checkout with "Cannot find type definition file for
        # '@cloudflare/workers-types'" — proven by cloning fresh and running
        # `npm ci && npm run verify` with nothing else installed.
        run: npm run worker:install

      - name: Verify and export web build
        # check:theme + typecheck + lint + export, then the dist/ that ships.
        # EXPO_PUBLIC_* values are inlined at build time, so they must be
        # present here rather than at deploy time.
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run verify

      - name: Require deploy secrets
        # The export happily succeeds with empty Supabase env — the client is
        # constructed lazily, so nothing touches it during prerender. Without
        # this the pipeline would publish a site that throws the moment anyone
        # tries to sign in. Fail here, with the name of what is missing.
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          for name in EXPO_PUBLIC_SUPABASE_URL EXPO_PUBLIC_SUPABASE_ANON_KEY \
                      CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "Missing repository secrets:$missing"
            echo "Add them under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=wasla
